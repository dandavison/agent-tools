# Models offered by `agent pick` (`agent run`, `agent from-issues`).
# cli: claude | codex | pi. A model with `health` is offered only if that URL responds.
# openrouter: OpenRouter model id, used to look up prices in the cache written by
# `agent prices-refresh`. `agent run` uses them for codex (claude reports its own cost).
# Long-context price tiers are ignored.

# The org each account's claude login store must be logged in to; agent pick checks it.
[claude_orgs]
default = "bc1248c3-30a9-4048-854d-46d5a7a66f07"  # Temporal Technologies
personal = "4f25dbb8-e6b5-4584-8a45-accc09442150"  # dandavison7@gmail.com

[accounts.personal]
CLAUDE_CONFIG_DIR = "~/.claude-personal"
# Claude Code's login profile store (default ~/.config/anthropic) overrides CLAUDE_CONFIG_DIR's login.
ANTHROPIC_CONFIG_DIR = "~/.config/anthropic-personal"
CODEX_HOME = "~/.codex-personal"

[[models]]
name = "opus"
cli = "claude"
model = "claude-opus-5-5"

[[models]]
name = "sonnet"
cli = "claude"
model = "claude-sonnet-5-5"

[[models]]
name = "haiku"
cli = "claude"
model = "claude-haiku-4-5-20251001"

[[models]]
name = "luna"
cli = "codex"
model = "gpt-6-luna"
openrouter = "openai/gpt-6-luna"

[[models]]
name = "qwen-local"
cli = "pi"
model = "mlx/mlx-community/Qwen3.6-35B-A3B-4bit"
health = "http://localhost:8080/v1/models"
