[project]
name = "agent-tools"
version = "0.1.0"
description = "Run prompts, build context for agent sessions, and find past sessions"
readme = "README.md"
authors = [
    { name = "Dan Davison", email = "dandavison7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "cryptography>=50.0.0",
    "httpx>=0.28.1",
    "markdown-it-py[linkify]>=4.2.0",
    "orjson>=3.11.9",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0",
    "segno>=1.6.6",
]

[project.scripts]
agent = "agent_tools.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.uv.build-backend]
module-name = ["agent_tools", "agent_sessions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/sessions imports helpers from its conftest, and shares test file names with tests/.
addopts = ["--import-mode=importlib"]
pythonpath = ["tests/sessions"]
